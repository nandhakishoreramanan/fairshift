<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f6e56">
  <title>FairShift – Worker</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css?v=4">
</head>
<body class="worker-app">
  <a class="skip-link" href="#view">Skip to content</a>
  <header class="topbar">
    <div class="brand"><span class="logo" aria-hidden="true">⚖️</span> <span data-i18n="app_name">FairShift</span></div>
    <div class="topbar-actions">
      <label class="sr-only" for="lang-select" data-i18n="language">Language</label>
      <select id="lang-select" class="lang-select"></select>
      <button id="logout" class="btn btn-ghost" type="button" data-i18n="logout">Log out</button>
    </div>
  </header>

  <main id="view" class="container worker-view" tabindex="-1" aria-live="polite"></main>

  <nav class="bottom-nav" aria-label="Main">
    <a href="#home" data-view="home"><span aria-hidden="true">🏠</span><span data-i18n="nav_home">Home</span></a>
    <a href="#attendance" data-view="attendance"><span aria-hidden="true">⏱️</span><span data-i18n="nav_attendance">Attendance</span></a>
    <a href="#pay" data-view="pay"><span aria-hidden="true">💰</span><span data-i18n="nav_pay">My Pay</span></a>
    <a href="#issues" data-view="issues"><span aria-hidden="true">📢</span><span data-i18n="nav_issues">Problems</span></a>
    <a href="#notices" data-view="notices"><span aria-hidden="true">📜</span><span data-i18n="nav_notices">Contracts</span></a>
  </nav>

  <script src="/js/i18n.js?v=4"></script>
  <script src="/js/common.js?v=4"></script>
  <script src="/js/vendor/jsQR.js"></script>
  <script src="/js/scanner.js?v=4"></script>
  <script src="/js/worker.js?v=4"></script>
</body>
</html>
